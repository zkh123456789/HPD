# general settings
name: HPD_x3
model_type: SRModel
scale: 3
num_gpu: 1  
manual_seed: 0

datasets:
  test: 
    name: UCMerced
    type: PairedImageDataset
    dataroot_gt: ~
    dataroot_lq: ~
    io_backend:
      type: disk


# network structures
network_g:
  type: HPD
  num_in_ch: 3
  num_out_ch: 3
  num_feat: 56
  num_atten: 56
  num_block: 8
  upscale: 3
  num_in: 4
  upsampler: pixelshuffledirect

# path
path:
  pretrain_network_g: ~
  param_key_g: params_ema
  strict_load_g: false

# validation settings
val:
  save_img: true
  suffix: ~  

  metrics:
    psnr: 
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
      better: higher 
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true
      better: higher
